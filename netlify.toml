[build]
  command = "npm run build"
  publish = "dist"

# Best-practice defaults for a static Astro site on Netlify.
# CSP allows: bundled JS from same origin; inline scroll-reveal script + JSON-LD; inline style
# attributes in markup; grain texture data: URL in global.css; self-hosted fonts/images/video.
# Extend connect-src if you add analytics, APIs, or third-party scripts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    X-XSS-Protection = "0"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self'; connect-src 'self'; upgrade-insecure-requests"
